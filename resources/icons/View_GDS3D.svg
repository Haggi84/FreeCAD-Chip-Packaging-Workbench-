<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- A stacked layout viewed in 3D, with an "open in external window" arrow:
       FreeCAD keeps the proxy, GDS3D does the looking. -->
  <polygon points="6,34 30,22 56,34 32,46" fill="#3d6389" fill-opacity="0.55"
           stroke="#24425c" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="6,26 30,14 56,26 32,38" fill="#4fb3e8" fill-opacity="0.55"
           stroke="#24425c" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="6,18 30,6 56,18 32,30" fill="#e8a33d" fill-opacity="0.7"
           stroke="#8a5a10" stroke-width="2" stroke-linejoin="round"/>
  <!-- external-window arrow -->
  <rect x="34" y="40" width="22" height="18" rx="2" fill="#ffffff"
        fill-opacity="0.9" stroke="#333333" stroke-width="2"/>
  <path d="M39,53 L51,45" stroke="#2e9e44" stroke-width="3" stroke-linecap="round"/>
  <polyline points="45,45 51,45 51,51" fill="none" stroke="#2e9e44"
            stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
