<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- DI-PASSIONATE project mark — same design as my_icon.svg (the
       workbench-selector icon), kept as its own file so the About dialog's
       larger "hero" presentation can evolve independently (e.g. a
       wordmark version) without touching the toolbar-facing icon. -->

  <!-- Leads (3 per side) -->
  <g fill="#37474f">
    <rect x="21" y="8"  width="4" height="8"/>
    <rect x="30" y="8"  width="4" height="8"/>
    <rect x="39" y="8"  width="4" height="8"/>
    <rect x="21" y="48" width="4" height="8"/>
    <rect x="30" y="48" width="4" height="8"/>
    <rect x="39" y="48" width="4" height="8"/>
    <rect x="8"  y="21" width="8" height="4"/>
    <rect x="8"  y="30" width="8" height="4"/>
    <rect x="8"  y="39" width="8" height="4"/>
    <rect x="48" y="21" width="8" height="4"/>
    <rect x="48" y="30" width="8" height="4"/>
    <rect x="48" y="39" width="8" height="4"/>
  </g>

  <!-- Package body -->
  <rect x="16" y="16" width="32" height="32" rx="4" fill="#1a2332" stroke="#0d1420" stroke-width="1.5"/>

  <!-- Die -->
  <rect x="25" y="25" width="14" height="14" rx="1.5" fill="#1A99E6"/>

  <!-- Bond wires (die pad -> lead) -->
  <g fill="none" stroke="#ffb300" stroke-width="1.6" stroke-linecap="round">
    <path d="M 27 25 Q 24 18 22 12"/>
    <path d="M 37 25 Q 40 18 42 12"/>
    <path d="M 39 30 Q 46 28 52 32"/>
  </g>
  <g fill="#ffb300">
    <circle cx="27" cy="25" r="1.4"/>
    <circle cx="37" cy="25" r="1.4"/>
    <circle cx="39" cy="30" r="1.4"/>
  </g>
</svg>
