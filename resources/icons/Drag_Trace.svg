  <circle cx="56" cy="52" r="5" fill="#cc8833" stroke="#7a4d18" stroke-width="2"/>
  <path d="M13,52 L51,52" fill="none" stroke="#cc8833" stroke-width="3"
        stroke-opacity="0.35" stroke-linecap="round" stroke-dasharray="3,3"/>
  <path d="M13,52 L22,52 L32,30 L42,30 L51,52" fill="none" stroke="#cc8833"
        stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- move cursor at the grab point -->
  <g stroke="#222222" stroke-width="1.5" fill="#ffffff" stroke-linejoin="round">
    <path d="M37,10 L41,15 L38.5,15 L38.5,19 L42.5,19 L42.5,16.5 L47.5,20.5
             L42.5,24.5 L42.5,22 L38.5,22 L38.5,26 L41,26 L37,31 L33,26 L35.5,26
             L35.5,22 L31.5,22 L31.5,24.5 L26.5,20.5 L31.5,16.5 L31.5,19
             L35.5,19 L35.5,15 L33,15 Z"/>
  </g>
</svg>
