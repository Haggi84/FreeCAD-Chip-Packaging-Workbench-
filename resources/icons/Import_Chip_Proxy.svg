  <!-- Bond pads on top -->
  <circle cx="16" cy="20" r="2.6" fill="#e64d1a"/>
  <circle cx="36" cy="20" r="2.6" fill="#e64d1a"/>
  <circle cx="26" cy="40" r="2.6" fill="#e64d1a"/>

  <!-- Speed/fast indicator -->
