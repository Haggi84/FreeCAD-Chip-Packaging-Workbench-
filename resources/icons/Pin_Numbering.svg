<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Package body -->
  <rect x="18" y="18" width="28" height="28" rx="2"
        fill="#9ec6e0" fill-opacity="0.35"
        stroke="#1f5b80" stroke-width="3"/>
  <!-- Leads -->
  <g stroke="#1f5b80" stroke-width="3">
    <line x1="6"  y1="24" x2="18" y2="24"/>
    <line x1="6"  y1="40" x2="18" y2="40"/>
    <line x1="46" y1="24" x2="58" y2="24"/>
    <line x1="46" y1="40" x2="58" y2="40"/>
  </g>
  <!-- Pin number labels -->
  <g fill="#1f5b80" font-family="sans-serif" font-size="9" font-weight="bold">
    <text x="0"  y="21">1</text>
    <text x="0"  y="45">2</text>
    <text x="53" y="21">3</text>
    <text x="53" y="45">4</text>
  </g>
</svg>
