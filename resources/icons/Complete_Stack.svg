<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- A stack seen from the side: the levels this layout draws on are solid,
       the ones it leaves empty are outlined at their own heights. -->
  <rect x="8" y="46" width="48" height="10" rx="1" fill="#b9c6d6" stroke="#2c4460" stroke-width="1.5"/>
  <text x="10" y="54" font-family="sans-serif" font-size="7" fill="#2c4460">Si</text>

  <!-- empty levels: outlined, dashed -->
  <rect x="8" y="40" width="48" height="4" fill="none" stroke="#8d9bad" stroke-width="1.2" stroke-dasharray="3 2"/>
  <rect x="8" y="33" width="48" height="4" fill="none" stroke="#8d9bad" stroke-width="1.2" stroke-dasharray="3 2"/>
  <rect x="8" y="26" width="48" height="4" fill="none" stroke="#8d9bad" stroke-width="1.2" stroke-dasharray="3 2"/>

  <!-- drawn levels: solid metal -->
  <rect x="12" y="18" width="18" height="5" fill="#e6c229" stroke="#7a5c10" stroke-width="1.2"/>
  <rect x="36" y="18" width="16" height="5" fill="#e6c229" stroke="#7a5c10" stroke-width="1.2"/>
  <rect x="16" y="9" width="32" height="6" fill="#e6a020" stroke="#7a5c10" stroke-width="1.2"/>
  <rect x="26" y="15" width="6" height="3" fill="#cc8833" stroke="#7a5c10" stroke-width="1"/>
</svg>
