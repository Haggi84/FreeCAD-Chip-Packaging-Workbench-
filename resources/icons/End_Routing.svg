<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Grey "stop session" badge — distinct from the green confirm / red abort
       pair, since this ends the whole routing session rather than acting on
       a single in-progress trace. -->
  <circle cx="32" cy="32" r="30" fill="#666666" stroke="#333333" stroke-width="2"/>
  <rect x="20" y="20" width="24" height="24" rx="2" ry="2" fill="white"/>
</svg>
