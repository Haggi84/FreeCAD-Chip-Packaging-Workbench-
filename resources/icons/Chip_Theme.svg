<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The workbench skin: a die split down the middle, stock light chrome on
       the left, the dark silicon-and-copper flavour on the right. -->
  <defs>
    <clipPath id="leftHalf"><rect x="0" y="0" width="32" height="64"/></clipPath>
    <clipPath id="rightHalf"><rect x="32" y="0" width="32" height="64"/></clipPath>
  </defs>

  <!-- light half -->
  <g clip-path="url(#leftHalf)">
    <rect x="8" y="14" width="48" height="36" rx="3" fill="#e8e8ea"/>
    <rect x="18" y="24" width="28" height="16" fill="#c4c8cc"/>
    <g fill="#8a8f95">
      <rect x="13" y="17" width="6" height="3"/>
      <rect x="23" y="17" width="6" height="3"/>
      <rect x="13" y="44" width="6" height="3"/>
      <rect x="23" y="44" width="6" height="3"/>
    </g>
  </g>

  <!-- dark half -->
  <g clip-path="url(#rightHalf)">
    <rect x="8" y="14" width="48" height="36" rx="3" fill="#171d26"/>
    <rect x="18" y="24" width="28" height="16" fill="#212a36"/>
    <g fill="#c87137">
      <rect x="35" y="17" width="6" height="3"/>
      <rect x="45" y="17" width="6" height="3"/>
      <rect x="35" y="44" width="6" height="3"/>
      <rect x="45" y="44" width="6" height="3"/>
    </g>
  </g>

  <rect x="8" y="14" width="48" height="36" rx="3" fill="none"
        stroke="#303c4b" stroke-width="2"/>
  <!-- the dividing seam -->
  <path d="M32,14 L32,50" stroke="#d4a017" stroke-width="2"/>
  <!-- accent swatches, the thing the command actually lets you pick -->
  <circle cx="20" cy="57" r="4" fill="#c87137"/>
  <circle cx="32" cy="57" r="4" fill="#d4a017"/>
  <circle cx="44" cy="57" r="4" fill="#3f8f5a"/>
</svg>
