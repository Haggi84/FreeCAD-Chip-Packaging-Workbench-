<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- A trace running over the top face of a body and down its front flank,
       crossing the shared edge — the thing this tool does that the
       single-face routers cannot. -->
  <!-- top face -->
  <polygon points="10,22 34,10 56,20 32,32"
           fill="#9a9a9a" fill-opacity="0.45" stroke="#555555" stroke-width="2"
           stroke-linejoin="round"/>
  <!-- front flank -->
  <polygon points="10,22 32,32 32,52 10,42"
           fill="#7d7d7d" fill-opacity="0.45" stroke="#555555" stroke-width="2"
           stroke-linejoin="round"/>
  <!-- right flank -->
  <polygon points="32,32 56,20 56,40 32,52"
           fill="#6b6b6b" fill-opacity="0.45" stroke="#555555" stroke-width="2"
           stroke-linejoin="round"/>
  <!-- the trace: over the top, across the edge, down the flank -->
  <polyline points="18,21 30,15 42,20 32,32 22,40"
            fill="none" stroke="#cc8833" stroke-width="4"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- pads at both ends -->
  <circle cx="18" cy="21" r="4" fill="#ffcc00" stroke="#7a5c00" stroke-width="2"/>
  <circle cx="22" cy="40" r="4" fill="#ffcc00" stroke="#7a5c00" stroke-width="2"/>
  <!-- the shared edge the trace crosses -->
  <path d="M32,32 L32,32" stroke="#3fa9f5" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="3" fill="none" stroke="#3fa9f5" stroke-width="2"/>
</svg>
